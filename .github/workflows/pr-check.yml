name: PR Build és Lighthouse Audit

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  security-events: write # Socket-hez kell
  checks: write

jobs:
  build-and-audit:
    name: Build, Lint és Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar és Codecov miatt

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Függőségek telepítése
        run: npm ci

      # --- 1. BIZTONSÁG: Socket.dev (ingyen open source-ra) ---
      - name: Socket Security Scan
        uses: SocketDev/socket-security-action@main
        with:
          github_api_token: ${{ secrets.GITHUB_TOKEN }}

      - name: TypeScript típusellenőrzés (Lint)
        run: npm run lint

      - name: Projektek buildelése
        run: npm run build

      # --- 2. BUNDLE SIZE: modernebb, PR kommenttel ---
      - name: Bundle size check (size-limit)
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # package.json-ban lévő "size-limit" configot használja

      # Fallback a te eredeti check-ed, ha nincs size-limit config
      - name: Bundle size fallback check
        if: failure()
        run: |
          SIZE=$(du -sk dist 2>/dev/null | cut -f1 || echo 0)
          echo "Bundle size: ${SIZE}KB"
          if [ "$SIZE" -gt 5000 ]; then
            echo "::warning::Bundle larger than 5MB (${SIZE}KB)"
          fi

      # --- 3. TESZT + CODECOV (ha van npm test) ---
      - name: Tesztek futtatása coverage-el
        run: npm test -- --coverage --watchAll=false || echo "Nincs test script, skip"
        
      - name: Codecov feltöltés
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false # ne blokkoljon ha nincs token

      # --- 4. SONARCLOUD (opcionális, ingyen open source-ra) ---
      # Ehhez sonarcloud.io-n be kell kötni a repót és SONAR_TOKEN secretet felvenni
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- LIGHTHOUSE RÉSZ - a te eredetid változatlan ---
      - name: Helyi preview szerver indítása
        run: |
          npm run start > /dev/null 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Preview szerver elérhető."
              break
            fi
            sleep 1
          done

      - name: Lighthouse audit és összehasonlítás futtatása
        run: |
          node scripts/lighthouse-pr-compare.js "https://felhosip-web.github.io/Koltseg-Web/" "http://localhost:3000/"

      - name: Helyi preview szerver leállítása
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

      - name: Lighthouse eredmények kommentelése a PR alá
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const commentPath = './lighthouse-comment.md';
            if (!fs.existsSync(commentPath)) {
              console.log('Nem található a lighthouse-comment.md fájl.');
              return;
            }
            const body = fs.readFileSync(commentPath, 'utf8');
            const identifier = '<!-- lighthouse-pr-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(identifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log('PR komment frissítve!');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
              console.log('Új PR komment létrehozva!');
            }
