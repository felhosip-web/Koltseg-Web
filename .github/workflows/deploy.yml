# A workflow neve, ez fog megjelenni a GitHub Actions fülön
name: Deploy static content to Pages

on:
  # Mikor fusson le ez a workflow?
  push:
    # Ha push történik ezekre a branchekre
    branches: ["main"]

  # Ez engedi, hogy a GitHub felületen kézzel is elindíthasd egy gombbal
  workflow_dispatch:

# Jogosultságok beállítása - enélkül nem tud deployolni Pages-re
permissions:
  contents: read      # Engedi olvasni a repó tartalmát
  pages: write        # Engedi írni a GitHub Pages-t
  id-token: write     # Kell a Pages deploy hitelesítéséhez

# Ha gyorsan pusholsz kétszer, ne induljon 2 deploy egyszerre
concurrency:
  group: "pages"              # Minden Pages deploy egy csoportba tartozik
  cancel-in-progress: false   # A futó deployt ne szakítsa meg, csak a várakozókat dobja

jobs:
  # Egyetlen job-unk van, a neve "deploy"
  deploy:
    # GitHub Pages környezet - itt fog megjelenni az élő URL
    environment:
      name: github-pages
      # A deploy lépés kimenetéből veszi ki az URL-t (pl. https://f-peter.github.io/...)
      url: ${{ steps.deployment.outputs.page_url }}
    # Milyen gépen fusson? Ubuntu a leggyorsabb/legolcsóbb
    runs-on: ubuntu-latest
    steps:
      # 1. LÉPÉS: Letölti a repód kódját a futó gépre
      - name: Checkout
        uses: actions/checkout@v4 # Ez egy kész GitHub akció

      # 2. LÉPÉS: Feltelepíti a Node.js-t (mert npm builded van)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20    # Node 20-as verzió
          cache: 'npm'        # Gyorsítja a telepítést cache-eléssel

      # 3. LÉPÉS: Függőségek telepítése
      - name: Install dependencies
        # Megpróbálja a gyors, tiszta telepítést (npm ci), ha nincs lockfile, akkor sima install
        run: npm ci || npm install

      # 4. LÉPÉS: Létrehozza a settings.json-t a titkos kulcsokból
      # EZ A LÉNYEG: a SUPABASE_URL és KEY nem lehet a GitHubon, ezért Secretből generáljuk
      - name: Create settings.json from secrets
        run: |
          cat > settings.json <<'EOF'
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF
          # A ${{ secrets... }} részeket a GitHub cseréli ki futáskor a te beállított Secretjeidre

      # 5. LÉPÉS: Buildeli a projektet (pl. Vite / React / Vue)
      - name: Build
        run: npm run build # Ez csinálja a /dist mappát

      # 6. LÉPÉS: Előkészíti a GitHub Pages-t
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. LÉPÉS: Feltölti a build eredményét artifactként
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Csak a lebuildelt dist mappát töltjük fel, nem az egész repót
          path: './dist'

      # 8. LÉPÉS: Tényleges deploy GitHub Pages-re
      - name: Deploy to GitHub Pages
        id: deployment # Kell, hogy fentebb ki tudjuk olvasni a page_url-t
        uses: actions/deploy-pages@v4
