name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feature', 'feat']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug', 'hotfix']
  - title: '🧹 Maintenance'
    labels: ['chore', 'dependencies']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## Changes
  $CHANGES
